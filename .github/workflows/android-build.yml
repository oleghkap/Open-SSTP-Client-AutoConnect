name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auto-connect-vpnclientpro

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace